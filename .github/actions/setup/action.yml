name: setup
description: Install Bun (version from package.json) and the locked dependencies. Run actions/checkout first.

inputs:
  frozen-lockfile:
    description: Fail when bun.lock is out of date
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}
