name: ci

# Every push / PR runs the full check + test + lint matrix. This is
# the contract the release workflow relies on — if `ci` is green on a
# tagged commit, the release workflow's typecheck/test gate is a
# rerun (intentional belt-and-suspenders).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Workspace typecheck
        run: bun run check

      - name: Workspace tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Dead code (knip)
        run: bun run knip
