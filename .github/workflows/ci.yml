name: ci

# Every push / PR runs the full check + test + lint matrix. This is
# the contract the release workflow relies on — if `ci` is green on a
# tagged commit, the release workflow's typecheck/test gate is a
# rerun. The release workflow calls this file as its gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Workspace typecheck
        run: bun run check

      - name: Build
        run: bun run build

      - name: Workspace tests with coverage thresholds
        run: bun run test:coverage

      - name: Lint (warnings fail)
        run: bun run lint

      - name: Formatting (dprint)
        run: bun run fmt:check

      - name: Dead code (knip)
        run: bun run knip

  docker-e2e:
    name: docker build e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build every fixture's generated Dockerfile with real docker
        working-directory: packages/docker
        env:
          KONFIG_E2E_DOCKER: "1"
        run: bunx vitest run src/e2e/dockerBuild.e2e.test.ts --testTimeout=600000

  peer-floor:
    name: peer floor (effect 4.1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Pin the effect family to the declared peer floor
        run: |
          jq '.catalog.effect = "4.1.0" | .catalog["@effect/vitest"] = "4.1.0" | .catalog["@effect/platform-node"] = "~4.1.0"' package.json > package.floor.json
          mv package.floor.json package.json
          for f in packages/core/package.json packages/cli/package.json; do
            jq '.dependencies["@effect/platform-node"] = "~4.1.0"' "$f" > "$f.floor"
            mv "$f.floor" "$f"
          done

      - uses: ./.github/actions/setup
        with:
          frozen-lockfile: "false"

      - name: Assert the floor versions were installed
        run: |
          bun pm ls --all | grep -E ' effect@4\.1\.0$'
          bun pm ls --all | grep -E ' @effect/platform-node@4\.1\.'
          ! bun pm ls --all | grep -E ' @effect/platform-node@4\.[2-9]'

      - name: Typecheck and test every effect-peer package at the floor
        run: |
          for pkg in $(jq -r 'select(.peerDependencies.effect) | .name | ltrimstr("@konfig.ts/")' packages/*/package.json); do
            bun run --cwd "packages/$pkg" check
            bun run --cwd "packages/$pkg" test
          done
