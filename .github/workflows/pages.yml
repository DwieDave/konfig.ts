name: pages

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "examples/full-stack/**"
      - "packages/**"
      - "bun.lock"
      - ".github/actions/setup/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Regenerate test and coverage stats (.github/badges/stats.json)
        run: bun run test:coverage
      - name: Check website
        run: bun run --cwd apps/website check
      - name: Build website
        run: bun run --cwd apps/website build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
